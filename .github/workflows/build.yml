name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

# A tag build signs the release APK with the keystore held in the repository
# secrets. Without them it still builds and publishes the unsigned APK, which
# has to be signed by hand the way the README describes.
env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK the project pins
        # The runner's shell has pipefail on, and yes dies of SIGPIPE once
        # sdkmanager stops reading, so its exit code is not the one that counts
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null

      - name: Unit tests
        run: ./gradlew --no-daemon testNonRootDebugUnitTest

      - name: Native unit tests
        run: make -C app/src/test/cpp test

      - name: Signing key
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-moonlightvr}
          EOF

      - name: Build
        run: ./gradlew --no-daemon assembleNonRootDebug assembleNonRootRelease lintNonRootRelease

      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-xr-apks
          path: |
            app/build/outputs/apk/nonRoot/debug/*.apk
            app/build/outputs/apk/nonRoot/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-nonRootRelease.html
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/nonRoot/release/*.apk
          generate_release_notes: true
