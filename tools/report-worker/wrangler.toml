# Deploys worker.js with `npx wrangler deploy` from this folder. README.md has
# the steps around it.
name = "moonlight-xr-reports"
main = "worker.js"
compatibility_date = "2025-01-01"

# Where the mail comes from and goes to. Until a sending domain is verified
# with Resend, the from address has to be onboarding@resend.dev and the to
# address has to be the one the Resend account was made with.
[vars]
RESEND_FROM = "onboarding@resend.dev"
RESEND_TO = "hello@seangilleece.com"

# Two secrets, set with `npx wrangler secret put <NAME>` so neither sits in
# this file:
#   RESEND_API_KEY  from the Resend dashboard, API Keys
#   REPORT_TOKEN    a long random string, the same one that goes in the app's
#                   gradle.properties as moonlightReportToken

# Optional: also keep every report in an R2 bucket. R2 is metered rather than
# capped, which is why this is off. Create the bucket first if turning it on.
# [[r2_buckets]]
# binding = "REPORTS"
# bucket_name = "moonlight-xr-reports"
