apply plugin: 'com.android.application'

// Signing details for the sideloaded release build, kept out of the repo.
// Without the file the release build still works, it just comes out unsigned
// and has to be signed by hand the way the README describes.
def signingProps = new Properties()
def signingPropsFile = rootProject.file('keystore.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def canSign = signingProps.containsKey('storePassword')

// Turns xr_shared.h, the one file holding every constant the native renderer
// and the Java side agree on, into XrShared.java, so neither side carries a
// copy that can drift. The header is kept to plain #define lines of integer
// and float constants and expressions over earlier ones, which is all this
// reads; anything else fails the build rather than quietly producing Java
// that means something different.
abstract class GenerateXrShared extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getHeader()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        def headerFile = header.get().asFile
        def define = ~/^#define\s+([A-Z][A-Z0-9_]*)\s+(.+?)\s*$/
        def floats = [] as Set
        def defined = [] as Set
        def body = []
        boolean inGuard = false
        headerFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed.startsWith('#ifndef')) {
                // The file comment above the include guard describes the header
                // itself, so the class starts with the first constant instead
                inGuard = true
                body.clear()
                return
            }
            if (!inGuard || trimmed.startsWith('#endif')) {
                return
            }
            if (trimmed.startsWith('//')) {
                body << '    ' + trimmed
                return
            }
            def m = define.matcher(line)
            if (!m.matches()) {
                if (trimmed.isEmpty() && !body.isEmpty() && body.last() != '') {
                    body << ''
                }
                return
            }
            def name = m.group(1)
            def value = m.group(2).replaceAll(/\s*\/\/.*$/, '').trim()
            if (!(value ==~ /[A-Za-z0-9_.+\-*\/() ]+/)) {
                throw new GradleException("${headerFile.name}: ${name} is not a plain constant: ${value}")
            }
            def names = value.findAll(/[A-Z][A-Z0-9_]*/)
            def unknown = names.findAll { !(it in defined) }
            if (!unknown.isEmpty()) {
                throw new GradleException("${headerFile.name}: ${name} refers to ${unknown} before it is defined")
            }
            boolean isFloat = value ==~ /.*\d[fF]\b.*/ || value.contains('.') || names.any { it in floats }
            if (isFloat) {
                floats << name
            }
            defined << name
            body << "    public static final ${isFloat ? 'float' : 'int'} ${name} = ${value};"
        }
        while (!body.isEmpty() && body.last() == '') {
            body.removeLast()
        }
        def out = new File(outputDir.get().asFile, 'com/limelight/binding/video/XrShared.java')
        out.parentFile.mkdirs()
        out.text = ([
            'package com.limelight.binding.video;',
            '',
            '/**',
            " * Every value the native renderer and this side agree on, generated from",
            " * ${headerFile.name} by the build. Change the header, not this file.",
            ' */',
            'public final class XrShared {',
            '    private XrShared() {',
            '    }',
            '',
        ] + body + ['}', '']).join('\n')
    }
}

def generateXrShared = tasks.register('generateXrShared', GenerateXrShared) {
    header = layout.projectDirectory.file('src/main/jni/xr-renderer/xr_shared.h')
    outputDir = layout.buildDirectory.dir('generated/source/xrshared')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.java.addGeneratedSourceDirectory(generateXrShared, { it.outputDir })
    }
}

android {
    ndkVersion "29.0.14206865"

    compileSdk 37

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 36

        versionName "12.1-xr0.3"
        versionCode = 31403

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'

        // Where the report a problem screen sends reports and the token the
        // collector expects, from gradle.properties. A build with neither keeps
        // reports on the device and tells the user where, see
        // tools/report-worker.
        buildConfigField "String", "REPORT_URL", "\"${project.findProperty('moonlightReportUrl') ?: ''}\""
        buildConfigField "String", "REPORT_TOKEN", "\"${project.findProperty('moonlightReportToken') ?: ''}\""
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
        prefab = true
        resValues = true
    }

    androidResources {
        // The depth model is mmapped straight out of the APK
        noCompress 'tflite'
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            applicationId "com.gilleece.moonlightxr.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            applicationId "com.gilleece.moonlightxr"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    signingConfigs {
        release {
            if (canSign) {
                storeFile rootProject.file(signingProps.getProperty('storeFile', 'release.keystore'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias', 'moonlightvr')
                // Most keystores use one password for both
                keyPassword signingProps.getProperty('keyPassword',
                                                     signingProps.getProperty('storePassword'))
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Moonlight XR (Debug)"
            resValue "string", "app_label_root", "Moonlight XR (Root Debug)"

            // The renderer's setprop tuning knobs and frame capture live in
            // debug builds only
            externalNativeBuild {
                ndkBuild {
                    arguments "XR_DEBUG_KNOBS=1"
                }
            }

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-rules-debug.pro'
        }
        release {
            // This fork ships under its own applicationId, so the unofficial
            // suffix upstream asks forks to keep is no longer needed.
            resValue "string", "app_label", "Moonlight XR"
            resValue "string", "app_label_root", "Moonlight XR (Root)"

            if (canSign) {
                signingConfig signingConfigs.release
            }

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    packaging {
        resources {
            // BouncyCastle includes duplicate LICENSE.md files
            excludes += '/META-INF/*.md'
        }
    }
}

dependencies {
    // Khronos OpenXR loader, Apache 2.0
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.49'
    // LiteRT runtime and GPU delegate, Apache 2.0
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.2'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
}
